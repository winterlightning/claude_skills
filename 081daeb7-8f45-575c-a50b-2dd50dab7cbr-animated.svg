<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <style>
    /* Sketching: dress fades to a guide and is redrawn while the pencil writes. 3.2s loop. */
    .dress-guide { opacity: .2; }
    .dress-ink {
      stroke-dasharray: 131 132;
      animation: dress-draw 3.2s infinite;
    }
    .pencil {
      transform-box: fill-box;
      transform-origin: 0% 100%;   /* pivot on the pencil tip */
      animation: pencil-write 3.2s infinite;
    }
    @keyframes dress-draw {
      0%, 8%  { opacity: 1; stroke-dashoffset: 0; }
      14%     { opacity: 0; stroke-dashoffset: 0; }
      15%     { opacity: 0; stroke-dashoffset: 131; }
      15.01%  { opacity: 1; stroke-dashoffset: 131; animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
      66%, 100% { opacity: 1; stroke-dashoffset: 0; }
    }
    @keyframes pencil-write {
      0%, 8%  { transform: none; }
      13%     { transform: translate(-1px, -3px) rotate(-6deg); }
      17%     { transform: translate(-.5px, 0) rotate(0); }
      22%     { transform: translate(-3px, -1.5px) rotate(-3deg); }
      27%     { transform: translate(-1px, -.5px) rotate(2deg); }
      32%     { transform: translate(-3.5px, -2.5px) rotate(-3deg); }
      37%     { transform: translate(-1.5px, -1px) rotate(2deg); }
      42%     { transform: translate(-4px, -3px) rotate(-3deg); }
      47%     { transform: translate(-2px, -1.5px) rotate(2deg); }
      52%     { transform: translate(-3.5px, -3.5px) rotate(-3deg); }
      57%     { transform: translate(-1.5px, -1.5px) rotate(1deg); }
      62%     { transform: translate(-2px, -3px) rotate(-5deg); }
      70%, 100% { transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dress-ink, .pencil { animation: none; }
    }
  </style>

  
  
