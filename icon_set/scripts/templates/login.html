<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login · Pictographic</title><link rel="stylesheet" href="site.css"><script src="site.js" defer></script></head><body class="guest"><header class="site-header"><a class="site-brand" href="home.html"><span class="site-mark" aria-hidden="true">✳</span>Pictographic</a><nav class="site-nav" aria-label="Main navigation"><a href="home.html">Home</a><a href="icon-laboratory.html">Design rules</a><a href="icons.html">Icon</a><a href="index.html">Icon Grid</a><a href="primitives.html">Primitives</a></nav></header><main class="login-main"><p class="eyebrow">THE CREATIVE WORKSPACE</p><h1>Welcome back.</h1><p>Log in to generate icons and review new outputs.</p><form id="loginForm"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="site-button primary" id="loginSubmit">Log in</button><p id="loginMessage" role="status" aria-live="polite"></p></form><a href="index.html">Browse the icon grid ↗</a></main><footer class="site-footer"><span>Pictographic / A considered icon system</span><span>Sub · Solo · Container</span></footer><script>
document.getElementById('loginForm').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('loginSubmit'),message=document.getElementById('loginMessage');button.disabled=true;message.textContent='Logging in…';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const result=await response.json();if(!response.ok)throw Error(result.error||'Could not log in.');location.assign('generate.html');}catch(error){message.textContent=error.message||'Unable to connect. Please retry.';button.disabled=false;}};
</script></body></html>
