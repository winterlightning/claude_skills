<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Side pairs · Pictographic</title><meta name="robots" content="noindex"></head>
<body>
<p>Side pairs are on <a href="primitives.html?view=side">Progression › Side pairs</a>.</p>
<script>
// Side pairs live on Progression › Side pairs (the Svelte app in web/side-pairs). Links to this page (?q=, ?edit=, ?make=, ?position=,
// ?size=72 from Combinations, Experiment and older pages) open the same pair there.
const asked = new URLSearchParams(location.search), next = new URLSearchParams({view: 'side'});
for (const key of ['q', 'edit', 'make', 'position']) if (asked.get(key)) next.set(key, asked.get(key));
if (!next.get('q') && (asked.get('edit') || asked.get('make'))) next.set('q', asked.get('edit') || asked.get('make'));
if (asked.get('size') === '72') next.set('grid', '72');
location.replace('primitives.html?' + next);
</script>
</body></html>
