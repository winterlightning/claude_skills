<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generate icon · Pictographic</title><style>
*{box-sizing:border-box}body{font:16px system-ui;color:#202820;background:#f5f6f2;margin:0}main{max-width:1100px;margin:auto;padding:32px}nav{display:flex;gap:20px;margin-bottom:30px}a{color:#294f29}label{display:block;font-weight:600;margin:16px 0 8px}input,textarea,select,button{font:inherit;padding:11px;border:1px solid #ced7c8;border-radius:9px;background:white;color:inherit}input,textarea{width:100%}textarea{min-height:130px}button{cursor:pointer;margin:8px 8px 0 0}button:disabled{opacity:.5;cursor:default}.primary{background:#294f29;color:white}.card{background:white;padding:24px;border:1px solid #dce1d6;border-radius:14px;margin:20px 0}.preview{width:192px;aspect-ratio:1;object-fit:contain;background-color:#f7f9f4;background-image:linear-gradient(#dae1d566 1px,transparent 1px),linear-gradient(90deg,#dae1d566 1px,transparent 1px);background-size:4px 4px;padding:24px}.comparison{display:flex;gap:20px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}p{line-height:1.5;overflow-wrap:anywhere}.muted{color:#677263}[hidden]{display:none!important}
.pagination,.list-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.pagination button,.list-controls button,.list-controls label{margin:0}.list-controls label{font-size:14px}.pagination{margin:24px 0}.pagination select{min-width:70px}</style></head><body><main><nav><a href="index.html">← Icon library</a><strong>Generate icon</strong></nav><h1>Generate icon</h1><p>Create a candidate, review it, then add it to your library or discard it.</p><form id="generateForm" class="card"><label for="name">Icon name</label><input id="name" required maxlength="160" placeholder="e.g. Folded document"><label for="prompt">Icon brief</label><textarea id="prompt" rows="8" required maxlength="10000" placeholder="Subject: [the single object or symbol to create]
Purpose: [what the icon should communicate]
Shape / view: [silhouette, orientation, or perspective]
Key details: [only the details needed to recognize it]
Exclude: [text, extra symbols, or unwanted details]
Reference (optional): [describe a visual reference]"></textarea><label for="family">Icon type / skill</label><select id="family"><option value="auto">Auto — let the agent decide</option><option value="sub">Sub</option><option value="solo">Solo</option><option value="container">Container</option></select><label for="model">Model (optional)</label><input id="model" maxlength="100" placeholder="Use the server’s configured Codex model"><button id="submit" class="primary">Generate candidate</button><p id="message" role="status"></p></form><h2>Candidates & recent runs</h2><div class="list-controls"><button id="refresh" type="button">Refresh</button><label for="jobsPageSize">Runs per page</label><select id="jobsPageSize"><option value="10">10</option><option value="25">25</option><option value="50">50</option></select></div><p id="notice" role="status"></p><div id="jobs"></div><nav class="pagination" aria-label="Candidate pages"><button id="jobsPrevious" type="button" disabled>← Previous</button><label for="jobsPage" style="margin:0">Page</label><select id="jobsPage" disabled><option>1</option></select><span id="jobsPageInfo" role="status">of 1</span><button id="jobsNext" type="button" disabled>Next →</button></nav></main><script>
const $=id=>document.getElementById(id);let loading=false,last='',jobRows=[],jobsLoaded=false,page=1,pageSize=10,locateHash=true;
async function api(path,body){const response=await fetch('../api/generation'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(!(response.headers.get('content-type')||'').includes('application/json'))throw Error('Generation service unavailable. Restart deploy.py on the server.');const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed.');return data;}
$('generateForm').onsubmit=async event=>{event.preventDefault();$('submit').disabled=true;$('message').textContent='Starting agent…';try{await api('',{mode:'generate',name:$('name').value,prompt:$('prompt').value,family:$('family').value,model:$('model').value});$('message').textContent='Agent started. Your candidate will appear below.';page=1;locateHash=false;last='';await refresh();}catch(error){$('message').textContent=error.message;}finally{$('submit').disabled=false;}};
function element(tag,text){const el=document.createElement(tag);el.textContent=text;return el;}
async function decide(row,action,button){button.disabled=true;try{await api('/'+action,{id:row.id});await refresh();}catch(error){$('notice').textContent=error.message;button.disabled=false;}}
function readPages(){const params=new URLSearchParams(location.search);const value=Number(params.get('page'));page=Number.isSafeInteger(value)&&value>0?value:1;pageSize=[10,25,50].includes(Number(params.get('page_size')))?Number(params.get('page_size')):10;$('jobsPageSize').value=String(pageSize);}
function savePages(replace=false){const url=new URL(location.href);url.searchParams.set('page',page);url.searchParams.set('page_size',pageSize);if(url.href!==location.href)history[replace?'replaceState':'pushState'](null,'',url);}
function renderPage(replace=true){const pages=Math.max(1,Math.ceil(jobRows.length/pageSize));page=Math.min(page,pages);$('jobsPage').replaceChildren();for(let n=1;n<=pages;n++){const option=element('option',String(n));option.value=String(n);$('jobsPage').append(option);}$('jobsPage').value=String(page);$('jobsPage').disabled=pages===1;$('jobsPrevious').disabled=page===1;$('jobsNext').disabled=page===pages;$('jobsPageInfo').textContent='of '+pages;const start=(page-1)*pageSize;render(jobRows.slice(start,start+pageSize));$('notice').textContent=jobRows.length?'Showing '+(start+1)+'–'+Math.min(start+pageSize,jobRows.length)+' of '+jobRows.length+' runs':'No generation runs yet.';savePages(replace);}
function changePage(value){page=value;locateHash=false;renderPage(false);}
$('jobsPrevious').onclick=()=>changePage(page-1);$('jobsNext').onclick=()=>changePage(page+1);$('jobsPage').onchange=()=>changePage(Number($('jobsPage').value));$('jobsPageSize').onchange=()=>{pageSize=Number($('jobsPageSize').value);changePage(1);};window.addEventListener('popstate',()=>{readPages();if(jobsLoaded)renderPage();});readPages();
function render(rows){$('jobs').replaceChildren();for(const row of rows){const card=element('article','');card.className='card';card.id='job-'+row.id;card.append(element('h3',row.name+' · '+row.status),element('p',row.mode==='fix'?'Fix variant':'New icon'),element('p',row.prompt));if(row.error)card.append(element('p',row.error));if(row.candidate){card.append(element('p','Type: '+row.candidate.family+' · Python: '+row.path));if(row.status!=='discarded'){const previews=element('div','');previews.className='comparison';if(row.source){const old=element('figure','');const img=document.createElement('img');img.className='preview';img.src=row.source.preview_url;img.alt='Current icon';old.append(img,element('figcaption','Current icon'));previews.append(old);}const next=element('figure','');const img=document.createElement('img');img.className='preview';img.src='../api/generation/preview?id='+row.id;img.alt=row.name+' candidate';next.append(img,element('figcaption','Candidate'));previews.append(next);card.append(previews);}}
if(row.status==='candidate'){const accept=element('button','Add to grid');accept.className='primary';accept.onclick=()=>decide(row,'accept',accept);card.append(accept);}if(['candidate','failed'].includes(row.status)){const discard=element('button','Discard');discard.onclick=()=>decide(row,'discard',discard);card.append(discard);}if(row.status==='accepted'){const link=element('a','View in icon grid');link.href='index.html?q='+encodeURIComponent(row.candidate.icon_id);card.append(link);}const details=element('details','');details.append(element('summary','Run log'));const log=element('pre','Open to load log');details.append(log);details.ontoggle=async()=>{if(details.open){try{const response=await fetch('../api/generation/log?id='+row.id);log.textContent=await response.text();}catch{log.textContent='Could not load log.';}}};card.append(details);$('jobs').append(card);}}
async function refresh(){if(loading)return;loading=true;try{const rows=await api('');const serialized=JSON.stringify(rows);jobRows=rows;jobsLoaded=true;if(locateHash){const index=rows.findIndex(row=>'#job-'+row.id===location.hash);if(index>=0)page=Math.floor(index/pageSize)+1;locateHash=false;}if(serialized!==last){renderPage();last=serialized;}}catch(error){$('notice').textContent=error.message;}finally{loading=false;}}
$('refresh').onclick=()=>{last='';refresh();};refresh();setInterval(()=>{if(!document.hidden)refresh();},4000);
</script></body></html>
