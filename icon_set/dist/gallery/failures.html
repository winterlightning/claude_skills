<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const RULE_ORDER = ['bounds', 'spacing', 'holes', 'broken', 'other'];
const state = { rule: '', kind: '', q: '', family: '', sort: 'fewest', marks: true, shown: 0 };
const PAGE = 48;
const selectedKeys = new Set(), noteDrafts = new Map(), noteMessages = new Map(), noteSaving = new Set();
let bulkDiscarding = false;
const iconKey = icon => icon.family + '/' + icon.id;
function draftGet(key) { if (noteDrafts.has(key)) return noteDrafts.get(key); try { return localStorage.getItem('pictographic-feedback:' + key) || ''; } catch { return ''; } }
function draftSet(key,text) { noteDrafts.set(key,text); try { if(text)localStorage.setItem('pictographic-feedback:'+key,text);else localStorage.removeItem('pictographic-feedback:'+key); } catch {} }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.rule = p.get('rule') || ''; state.kind = p.get('kind') || '';
}
function writeHash() {
  const p = new URLSearchParams();
  if (state.rule) p.set('rule', state.rule);
  if (state.kind) p.set('kind', state.kind);
  history.replaceState(null, '', p.toString() ? '#' + p : location.pathname);
}

function matchesIssue(issue) {
  return (!state.rule || issue.rule === state.rule) && (!state.kind || issue.kind === state.kind);
}
function filtered() {
  const q = state.q.toLowerCase();
  let list = DATA.icons.filter(icon =>
    (!state.family || icon.family === state.family) &&
    icon.issues.some(matchesIssue) &&
    (!q || icon.id.includes(q) || icon.issues.some(i => i.text.toLowerCase().includes(q))));
  if (state.sort === 'most') list = [...list].sort((a, b) => b.issues.length - a.issues.length || a.id.localeCompare(b.id));
  if (state.sort === 'name') list = [...list].sort((a, b) => a.id.localeCompare(b.id));
  return list;
}

function renderNav() {
  // Counts are icons, not messages: how many drawings a fix to this kind touches.
  const pool = DATA.icons.filter(icon => !state.family || icon.family === state.family);
  const iconsWith = test => pool.filter(icon => icon.issues.some(test)).length;
  let html = `<div class="group"><button class="group-head ${!state.rule ? 'on' : ''}" data-rule="" data-kind="">
    <span>All failures</span><span class="count">${pool.length}</span></button></div>`;
  for (const rule of RULE_ORDER) {
    const kinds = DATA.kinds.filter(k => k.rule === rule);
    if (!kinds.length) continue;
    const total = iconsWith(i => i.rule === rule);
    html += `<div class="group"><button class="group-head ${state.rule === rule && !state.kind ? 'on' : ''}" data-rule="${rule}" data-kind="">
      <span><span class="dot" style="background:var(--${rule})"></span>${esc(DATA.rules[rule].title)}</span>
      <span class="count">${total}</span></button>`;
    const rows = kinds.map(k => ({ kind: k.kind, n: iconsWith(i => i.rule === rule && i.kind === k.kind) }))
      .filter(r => r.n).sort((a, b) => b.n - a.n);
    for (const r of rows) {
      html += `<button class="kind ${state.rule === rule && state.kind === r.kind ? 'on' : ''}" data-rule="${rule}" data-kind="${esc(r.kind)}">
        <span>${esc(r.kind)}</span><span class="count">${r.n}</span></button>`;
    }
    html += '</div>';
  }
  $('nav').innerHTML = html;
}

function renderExplain(count) {
  const box = $('explain');
  if (!state.rule) {
    box.style.setProperty('--accent', 'var(--muted)');
    box.innerHTML = `<h2>${count} failing icons</h2>
      <p>Pick a rule on the left to work through one kind of violation at a time. Each card draws the violation over the icon.</p>` + legend();
    return;
  }
  const rule = DATA.rules[state.rule];
  box.style.setProperty('--accent', `var(--${state.rule})`);
  box.innerHTML = `<h2>${esc(rule.title)}${state.kind ? ' · ' + esc(state.kind) : ''} <span class="sub">— ${count} icons</span></h2>
    <p>${esc(rule.summary)}</p><p class="fix"><b>Fix:</b> ${esc(rule.fix)}</p>` + legend();
}
function legend() {
  return `<div class="legend">
    <span><i style="border-color:var(--guide);border-top-style:dashed"></i>Keyshape envelope</span>
    <span><i style="border-color:var(--bounds)"></i>Actual ink box / radius (shaded: the mismatch)</span>
    <span><i style="border-color:var(--gap)"></i>Too-close gap</span>
    <span><i style="border-color:var(--hi);opacity:.5"></i>Parts involved</span>
    <span><i style="border-color:var(--holes)"></i>Undersized hole</span></div>`;
}

function elementHighlights(icon, issues) {
  const ids = new Set((icon.paths || []).map(p => p.id));
  const hits = new Set();
  for (const issue of issues) {
    for (const name of issue.elements || []) {
      if (ids.has(name)) { hits.add(name); continue; }
      // Edge names are often "<element>-<n>": fall back to the longest element id they extend.
      let best = '';
      for (const id of ids) if (id && name.startsWith(id + '-') && id.length > best.length) best = id;
      if (best) hits.add(best);
    }
  }
  return hits;
}

function iconSvg(icon, size, { marks, issues }) {
  const n = icon.canvas;
  const sw = icon.svg?.['stroke-width'] || 4;
  const hits = marks ? elementHighlights(icon, issues) : new Set();
  const u = n / size; // one screen pixel in canvas units
  let grid = '';
  if (size > 100) {
    for (let v = 4; v < n; v += 4) {
      grid += `<line x1="${v}" y1="0" x2="${v}" y2="${n}"/><line x1="0" y1="${v}" x2="${n}" y2="${v}"/>`;
    }
  }
  const paths = icon.paths.map(p =>
    `<path d="${esc(p.d)}"${hits.has(p.id) ? ' stroke="var(--hi)" stroke-opacity=".38"' : ''}><title>${esc(p.id)}</title></path>`).join('');
  let over = '';
  if (marks) {
    // The gap is drawn over the tinted parts with a halo, so it reads even where they overlap it.
    const gap = (a, b) => `<g stroke-linecap="round">
        <line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--panel)" stroke-width="${7 * u}"/>
        <line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--gap)" stroke-width="${3 * u}"/>
        ${[a, b].map(pt => `<circle cx="${pt[0]}" cy="${pt[1]}" r="${4.5 * u}" fill="var(--gap)" stroke="var(--panel)" stroke-width="${2 * u}"/>`).join('')}</g>`;
    const line = (w, color, dash) => `fill="none" stroke="${color}" stroke-width="${w * u}"${dash ? ` stroke-dasharray="${4 * u} ${3 * u}"` : ''}`;
    for (const issue of issues) {
      const o = issue.overlay;
      if (o?.type === 'box') {
        const [ex1, ey1, ex2, ey2] = o.env, [ix1, iy1, ix2, iy2] = o.ink;
        // Shade the band between envelope and ink: that band is the violation.
        over += `<path fill="var(--bounds)" fill-opacity=".28" fill-rule="evenodd" d="M${ex1} ${ey1}H${ex2}V${ey2}H${ex1}Z M${ix1} ${iy1}H${ix2}V${iy2}H${ix1}Z"/>`;
        over += `<rect x="${ex1}" y="${ey1}" width="${ex2 - ex1}" height="${ey2 - ey1}" ${line(1.5, 'var(--guide)', true)}/>`;
        over += `<rect x="${ix1}" y="${iy1}" width="${ix2 - ix1}" height="${iy2 - iy1}" ${line(1.5, 'var(--bounds)')} stroke-opacity=".55"/>`;
      } else if (o?.type === 'circle') {
        const [r1, r2] = [Math.min(o.env, o.ink), Math.max(o.env, o.ink)];
        over += `<path fill="var(--bounds)" fill-opacity=".28" fill-rule="evenodd" d="M${o.c[0] - r2} ${o.c[1]}a${r2} ${r2} 0 1 0 ${2 * r2} 0a${r2} ${r2} 0 1 0 ${-2 * r2} 0Z M${o.c[0] - r1} ${o.c[1]}a${r1} ${r1} 0 1 0 ${2 * r1} 0a${r1} ${r1} 0 1 0 ${-2 * r1} 0Z"/>`;
        over += `<circle cx="${o.c[0]}" cy="${o.c[1]}" r="${o.env}" ${line(1.5, 'var(--guide)', true)}/>`;
        over += `<circle cx="${o.c[0]}" cy="${o.c[1]}" r="${o.ink}" ${line(1.5, 'var(--bounds)')} stroke-opacity=".55"/>`;
      } else if (o?.type === 'gap') {
        over += gap(o.a, o.b);
      }
      if (issue.kind === 'Parallel straight edges too close') {
        for (const pair of icon.spacingPairs) {
          over += gap(pair.a, pair.b);
        }
      }
      if (issue.rule === 'holes') {
        for (const [x, y, w, h] of icon.holes) {
          over += `<rect x="${x - 1}" y="${y - 1}" width="${w + 2}" height="${h + 2}" rx="${2}" ${line(2, 'var(--holes)')}/>`;
        }
      }
    }
  }
  const bg = size > 100 ? `<rect width="${n}" height="${n}" fill="var(--canvas)"/>
    <g stroke="var(--grid)" stroke-width="${u}">${grid}</g>
    <rect x="${u / 2}" y="${u / 2}" width="${n - u}" height="${n - u}" fill="none" stroke="var(--line)" stroke-width="${u}"/>` : '';
  return `<svg viewBox="0 0 ${n} ${n}" width="${size}" height="${size}" role="img" aria-label="${esc(icon.id)}">${bg}
    <g fill="none" stroke="var(--ink)" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${paths}</g>${over}</svg>`;
}

function card(icon) {
  const active = icon.issues.filter(matchesIssue);
  const figure = icon.paths
    ? `<div class="big">${iconSvg(icon, 230, { marks: state.marks, issues: active })}</div>
       <div class="native">${iconSvg(icon, icon.canvas, { marks: false, issues: [] })}<span>${icon.canvas}px</span></div>`
    : `<div class="norender">No SVG<br>the model cannot be drawn until this is fixed</div>`;
  const issues = icon.issues.map(i => `<li class="${matchesIssue(i) ? '' : 'dim'}" style="--c:var(--${i.rule})">
      <div class="k">${esc(i.kind)}${i.keyshape ? ` <span class="badge">${esc(i.keyshape)}</span>` : ''}${i.distance != null ? ` <span class="badge">${i.distance}u / needs ${i.required}u</span>` : ''}</div>
      <div class="t mono">${esc(i.text)}</div></li>`).join('');
  return `<article class="card" data-key="${esc(iconKey(icon))}" data-selected="${selectedKeys.has(iconKey(icon))}">
    <div class="card-head"><label class="card-select"><input type="checkbox" data-select="${esc(iconKey(icon))}" aria-label="Select ${esc(icon.id)}" ${selectedKeys.has(iconKey(icon)) ? 'checked' : ''} ${bulkDiscarding || !icon.file ? 'disabled' : ''}></label><b>${esc(icon.id)}</b><span class="badge">${esc(icon.profile || icon.family)}</span></div>
    <button type="button" class="evidence-open" data-evidence="${esc(icon.family + '/' + icon.id)}" aria-label="Debug evidence for ${esc(icon.id)}"><div class="figure">${figure}</div><div class="evidence-hint">View debug evidence</div></button>
    <ul class="issues">${issues}</ul>
    <div class="note-box"><label for="note-${esc(icon.family+'-'+icon.id)}">Fix notes</label><textarea id="note-${esc(icon.family+'-'+icon.id)}" data-note="${esc(iconKey(icon))}" maxlength="10000" placeholder="Describe how you want this icon fixed…" ${noteSaving.has(iconKey(icon)) ? 'disabled' : ''}>${esc(draftGet(iconKey(icon)))}</textarea><button type="button" data-save-note="${esc(iconKey(icon))}" ${noteSaving.has(iconKey(icon)) ? 'disabled' : ''}>Save note</button><div class="note-status" role="status">${esc(noteMessages.get(iconKey(icon)) || '')}</div><details data-note-history="${esc(iconKey(icon))}"><summary>Saved notes</summary><div class="note-history"></div></details></div>
    <div class="card-foot">
      ${icon.file ? `<button class="path mono" data-copy="${esc(icon.file)}" title="Copy path">${esc(icon.file)}</button>` : '<span></span>'}
      ${icon.file ? `<button class="discard" data-discard="${esc(icon.family + '/' + icon.id)}" aria-label="Discard ${esc(icon.id)}" ${bulkDiscarding ? 'disabled' : ''}>Discard</button>` : ''}
      ${icon.svgUrl ? `<a href="${esc(icon.svgUrl)}" target="_blank" rel="noopener">SVG</a>` : ''}
    </div></article>`;
}

let current = [];
function render() {
  writeHash();
  renderNav();
  current = filtered();
  const eligible = new Set(current.map(iconKey)); for (const key of selectedKeys) if (!eligible.has(key)) selectedKeys.delete(key);
  renderExplain(current.length);
  $('grid').innerHTML = '';
  state.shown = 0;
  $('empty').hidden = current.length > 0;
  more();
  updateBulkSelection();
}
function more() {
  if (state.shown >= current.length) return;
  const next = current.slice(state.shown, state.shown + PAGE);
  $('grid').insertAdjacentHTML('beforeend', next.map(card).join(''));
  state.shown += next.length;
  updateBulkSelection();
}
new IntersectionObserver(entries => { if (entries.some(e => e.isIntersecting)) more(); }, { rootMargin: '1200px' })
  .observe($('more'));

const scope = DATA.families ? ` ${DATA.families.join(' + ')}` : '';
$('summary').textContent = (DATA.total
  ? `${DATA.failed} of ${DATA.total}${scope} icons failed the build`
  : `${DATA.failed}${scope} icons failed the build`) + ' · rendered from dist/failed, not shipped';
if (DATA.families && DATA.families.length === 1) $('family').hidden = true;
for (const family of [...new Set(DATA.icons.map(i => i.family))].sort()) {
  $('family').insertAdjacentHTML('beforeend', `<option value="${esc(family)}">${esc(family)}</option>`);
}
$('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-rule]');
  if (!b) return;
  state.rule = b.dataset.rule; state.kind = b.dataset.kind;
  render(); window.scrollTo({ top: 0 });
});
let timer;
$('search').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 150); });
$('family').addEventListener('change', e => { state.family = e.target.value; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('marks').addEventListener('change', e => { state.marks = e.target.checked; render(); });


function updateBulkSelection() {
  const shown = current.slice(0,state.shown).filter(i=>i.file);
  const count = shown.filter(i=>selectedKeys.has(iconKey(i))).length;
  $('selectShown').checked = shown.length > 0 && count === shown.length;
  $('selectShown').indeterminate = count > 0 && count < shown.length;
  $('selectShown').disabled = bulkDiscarding || !shown.length;
  $('selectedCount').textContent = selectedKeys.size + ' selected';
  $('discardSelected').disabled = bulkDiscarding || !!noteSaving.size || !selectedKeys.size;
  $('clearSelected').disabled = bulkDiscarding || !selectedKeys.size;
  for (const card of $('grid').querySelectorAll('[data-key]')) {
    const checkbox = card.querySelector('[data-select]'); checkbox.checked=selectedKeys.has(card.dataset.key); card.dataset.selected=String(checkbox.checked);
  }
}
$('selectShown').onchange = e => { for(const icon of current.slice(0,state.shown).filter(i=>i.file)) e.target.checked ? selectedKeys.add(iconKey(icon)) : selectedKeys.delete(iconKey(icon)); updateBulkSelection(); };
$('clearSelected').onclick = () => { selectedKeys.clear(); updateBulkSelection(); };
$('discardSelected').onclick = () => discardBatch(DATA.icons.filter(i=>selectedKeys.has(iconKey(i))));
$('grid').addEventListener('change', e => { if(e.target.matches('[data-select]')) { e.target.checked ? selectedKeys.add(e.target.dataset.select) : selectedKeys.delete(e.target.dataset.select); updateBulkSelection(); } });
$('grid').addEventListener('input', e => { if(e.target.matches('[data-note]')) draftSet(e.target.dataset.note,e.target.value); });
async function discardBatch(targets) {
  if(bulkDiscarding || !targets.length) return;
  if(noteSaving.size){$('discardNotice').textContent='Wait for your note to finish saving.';return;}
  if(!window.confirm('Discard '+targets.length+' icon(s)?\n\nThis removes their Python sources, generated files and saved notes. A backup is archived on the server.')) return;
  bulkDiscarding=true; const gone=new Set(), failures=[]; render();
  try {
    for(let offset=0;offset<targets.length;offset+=100) {
      const chunk=targets.slice(offset,offset+100); $('discardNotice').textContent='Discarding '+(offset+1)+'–'+(offset+chunk.length)+' of '+targets.length+'…';
      try {
        const response=await fetch('../api/icons/discard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({icons:chunk.map(i=>({icon:iconKey(i),svg_sha256:i.svg_sha256}))})});
        const result=await response.json(); if(!response.ok)throw Error(result.error||'Could not discard.');
        for(const row of result.discarded)gone.add(row.icon); failures.push(...result.failed);
      } catch(error) { failures.push(...chunk.map(i=>({icon:iconKey(i),error:error.message}))); }
    }
  } finally {
    DATA.icons=DATA.icons.filter(i=>!gone.has(iconKey(i)));DATA.failed=DATA.icons.length;DATA.total=Math.max(0,DATA.total-gone.size);
    for(const key of gone){selectedKeys.delete(key);draftSet(key,'');noteMessages.delete(key);}
    for(const row of failures)selectedKeys.add(row.icon);
    bulkDiscarding=false;render();$('summary').textContent=DATA.failed+' failing icons remaining';
    $('discardNotice').textContent='Discarded '+gone.size+' icon(s).'+(failures.length?' '+failures.length+' could not be discarded and remain selected. '+failures[0].error:'');
  }
}
async function saveNote(button) {
  const key=button.dataset.saveNote,icon=DATA.icons.find(i=>iconKey(i)===key),card=button.closest('[data-key]'),area=card.querySelector('[data-note]'),message=card.querySelector('.note-status');
  if(!icon || noteSaving.has(key) || bulkDiscarding)return;
  const text=area.value.trim();if(!text){message.textContent='Write your fix instructions first.';return;}
  noteSaving.add(key);updateBulkSelection();button.disabled=true;area.disabled=true;message.textContent='Saving…';
  try {
    const response=await fetch('../api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({icon:key,svg_sha256:icon.svg_sha256,feedback:text})});
    const result=await response.json();if(!response.ok)throw Error(result.error||'Could not save note.');
    draftSet(key,'');area.value='';noteMessages.set(key,'Note saved.');message.textContent='Note saved.';
    const details=card.querySelector('[data-note-history]');details.open=true;loadNotes(details);
  } catch(error) { noteMessages.set(key,error.message+' Your note is still here.');message.textContent=noteMessages.get(key); }
  finally{noteSaving.delete(key);updateBulkSelection();button.disabled=false;area.disabled=false;const live=[...$('grid').querySelectorAll('[data-key]')].find(c=>c.dataset.key===key);if(live){live.querySelector('[data-save-note]').disabled=false;const input=live.querySelector('[data-note]');input.disabled=false;input.value=draftGet(key);live.querySelector('.note-status').textContent=noteMessages.get(key)||'';}}
}
async function loadNotes(details) {
  const box=details.querySelector('.note-history');box.textContent='Loading…';
  try {
    const response=await fetch('../api/feedback?icon='+encodeURIComponent(details.dataset.noteHistory));const rows=await response.json();if(!response.ok)throw Error(rows.error||'Could not load notes.');
    box.textContent=rows.length?rows.map(r=>(r.author?r.author+' · ':'')+new Date(r.created_at).toLocaleString()+'\n'+r.feedback).join('\n\n'):'No saved notes yet.';
  }catch(error){box.textContent=error.message;}
}
$('grid').addEventListener('toggle',e=>{if(e.target.matches('[data-note-history]')&&e.target.open)loadNotes(e.target);},true);

let evidenceRequest = 0;
function closeEvidence() { evidenceRequest++; $('evidence').close(); }
$('closeEvidence').onclick = closeEvidence;
$('evidence').addEventListener('cancel', () => { evidenceRequest++; });
async function openEvidence(icon) {
  const request = ++evidenceRequest;
  $('evidenceTitle').textContent = icon.id + ' · Debug evidence';
  $('evidenceStatus').textContent = 'Loading distance and hole checks…';
  for (const id of ['evidenceImages', 'evidenceLinks', 'evidenceFindings']) $(id).replaceChildren();
  if (!$('evidence').open) $('evidence').showModal();
  try {
    const response = await fetch('../api/qa-evidence?icon=' + encodeURIComponent(icon.family + '/' + icon.id));
    const data = await response.json();
    if (!response.ok) throw Error(data.error || 'Evidence unavailable.');
    if (request !== evidenceRequest) return;
    const qa = data.qa_overlays, distance = qa.distance, holes = qa.holes;
    const verdict = value => value === true ? 'Pass' : value === false ? 'Fail' : 'Not measured';
    $('evidenceStatus').textContent = 'Build: ' + (data.library?.status || 'No saved result') +
      ' · Distance: ' + verdict(distance.distance_passed) + ' · Holes and pinches: ' + verdict(holes.negative_space_passed) +
      '\n' + (distance.distance_measured ? 'Closest distance: ' + distance.lowest_distance + 'u; required: ' + distance.distance_gate + 'u.' : 'No eligible distance pair to measure.') +
      ' Failed holes: ' + (holes.failed_hole_count ?? '—') + '; pinches: ' + (holes.pinch_count ?? '—') + '.';
    if (data.library && !data.library.svg_matches_published) $('evidenceStatus').textContent += '\nThe saved build evidence is for an older drawing.';
    for (const finding of [...(data.library?.errors || []), ...(data.library?.warnings || [])]) {
      const li = document.createElement('li'); li.textContent = typeof finding === 'string' ? finding : JSON.stringify(finding); $('evidenceFindings').append(li);
    }
    const addLink = (label, url) => { if (!url) return; const a = document.createElement('a'); a.textContent = label; a.href = url; a.target = '_blank'; a.rel = 'noopener'; $('evidenceLinks').append(a); };
    addLink('SVG', data.svg_url); addLink('Build measurements', data.library?.metrics_url);
    const images = [['Distance overlay',qa.images.distance],['Hole and pinch overlay',qa.images.holes]];
    for (const [name,url] of Object.entries(data.library?.artifacts || {})) if (name.endsWith('.png')) images.push(['Build '+name.replace('.png',''),url]);
    for (const [label,url] of images) {
      if (!url) continue;
      const figure = document.createElement('figure'), caption = document.createElement('figcaption'), a = document.createElement('a'), img = document.createElement('img');
      caption.textContent = label; img.alt = label + ' for ' + icon.id; img.src = url; a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.append(img); figure.append(caption,a); $('evidenceImages').append(figure);
    }
  } catch (error) { if (request === evidenceRequest) $('evidenceStatus').textContent = 'Could not load evidence: ' + error.message; }
}

$('grid').addEventListener('click', async e => {
  const evidence = e.target.closest('[data-evidence]');
  if (evidence) { const icon = DATA.icons.find(i => i.family + '/' + i.id === evidence.dataset.evidence); if (icon) openEvidence(icon); return; }

  const save = e.target.closest('[data-save-note]');
  if (save) { saveNote(save); return; }
  const discard = e.target.closest('[data-discard]');
  if (discard) { const icon = DATA.icons.find(i => iconKey(i) === discard.dataset.discard); if (icon) discardBatch([icon]); return; }

  const b = e.target.closest('[data-copy]');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); } catch { return; }
  $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 1200);
});
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash();
render();
</script>
</body>
</html>
