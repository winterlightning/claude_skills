# Pictographic review server: data and status in D1, references and large files in R2.
# Named pictographic-review so it never touches the account's existing `pictographic` bucket or search workers.
name = "pictographic-review"
main = "app/build/worker/shim.mjs"
compatibility_date = "2026-07-17"
account_id = "7a2ab07aab8b5b9a40885fa3546592fa"

[build]
# Build with rustup's toolchain (it has the wasm32 target); Homebrew's rustc may shadow it on PATH.
command = "cd app && PATH=\"$HOME/.cargo/bin:$PATH\" worker-build --release"

[[d1_databases]]
binding = "DB"
# The site's data is the database and bucket first made as the test copy (2026-10-02): the reviewers' work moved
# there, so on 2026-10-05 this URL was pointed at them and the original pictographic-review database was deleted.
# wrangler.next.toml serves the same database and bucket under the -next URL.
database_name = "pictographic-review-next"
database_id = "5f82dacf-d761-4dd5-97f8-177f08b88aee"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "pictographic-review-next"

[vars]
# Kept exactly as deploy.py's ADMIN_USERS (user's decision); change here without code changes.
ADMIN_USERS = '{"jakes": "1", "hina": "1", "ray": "1", "phuong": "1", "an": "1"}'
# From icon_set/model contracts: family id and canvas size.
BUILTIN_FAMILIES = '[["sub", 32], ["solo", 48], ["container", 64], ["combination_main", 48], ["symbol", 32]]'

# Python graphics (edit geometry, validation, SVG render) for the stroke editor and artwork picks:
# the pictographic-graphics Worker and its container (cloud/graphics).
[[services]]
binding = "GRAPHICS"
service = "pictographic-graphics"
