# Test copy of the review server: the same Worker code on its own D1 database and R2 bucket (copies of
# production), so changes can be tried on a second site without touching pictographic-review.
#   deploy:  npx wrangler deploy -c wrangler.next.toml
#   local:   npx wrangler dev -c wrangler.next.toml --persist-to /tmp/combo/state
# Refresh it from production: cloud/migrate/copy_bucket.py, a fresh `wrangler d1 export` imported
# into pictographic-review-next, then migrations and backfill_combinations.py (cloud/README.md).
name = "pictographic-review-next"
main = "app/build/worker/shim.mjs"
compatibility_date = "2026-07-17"
account_id = "7a2ab07aab8b5b9a40885fa3546592fa"
workers_dev = true

[build]
command = "cd app && PATH=\"$HOME/.cargo/bin:$PATH\" worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "pictographic-review-next"
database_id = "5f82dacf-d761-4dd5-97f8-177f08b88aee"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "pictographic-review-next"

[vars]
ADMIN_USERS = '{"jakes": "1", "hina": "1", "ray": "1", "phuong": "1", "an": "1"}'
BUILTIN_FAMILIES = '[["sub", 32], ["solo", 48], ["container", 64], ["combination_main", 48], ["symbol", 32]]'

# The graphics container keeps no state, so the test copy shares production's.
[[services]]
binding = "GRAPHICS"
service = "pictographic-graphics"
