[package]
name = "pictographic-core"
version = "0.1.0"
edition = "2021"
description = "Pure review, work-claim and primitive rules shared by the Worker; no Cloudflare bindings."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { version = "0.10", default-features = false }
quick-xml = "0.38"
regex-lite = "0.1"
sha2 = "0.10"
hex = "0.4"
